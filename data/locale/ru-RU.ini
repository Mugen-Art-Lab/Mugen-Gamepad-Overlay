GamepadViewerHelp="Плагин читает CSS и локальные SVG/PNG/JPEG как данные и отрисовывает их нативно. Браузер, JavaScript и сетевые запросы не используются. Полностью проверена коллекция frolovlife/gamepadviewer-skins; произвольный браузерный CSS может использовать неподдерживаемые возможности."
