TriggerMappingHelp="Источник триггера может быть аналоговой осью или любой кнопкой. Ось сохраняет плавное значение 0–100%; кнопка даёт 0% или 100%. В списках обычных кнопок LT/L2 и RT/R2 доступны как цифровые источники после указанного порога. Все назначения читают исходные сигналы устройства и не образуют цепочек друг через друга. Если назначить LT/L2 или RT/R2 на обычную кнопку оверлея, эта кнопка будет срабатывать от триггера параллельно с самим индикатором триггера."
