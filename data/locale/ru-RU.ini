InputOverlayHelp="Плагин ищет PNG-файлы рядом с выбранным JSON и показывает их в списке «Вариант оформления». Переключение варианта сразу обновляет предпросмотр. Небольшие выходы областей за край атласа обрезаются. Элементы клавиатуры и мыши пропускаются; старые INI-пресеты пока не поддерживаются."
Skin.GamepadViewer="Локальный скин GamepadViewer (CSS)"
