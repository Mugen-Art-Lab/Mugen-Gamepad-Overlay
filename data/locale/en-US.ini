TriggerMappingHelp="A trigger source may be an analog axis or any button. An axis preserves a smooth 0–100% value; a button produces 0% or 100%. The normal button lists also offer LT/L2 and RT/R2 as digital sources after the selected threshold. Every mapping reads the device's original signals, so mappings do not chain through one another. If LT/L2 or RT/R2 is assigned to a normal overlay button, that button is activated by the trigger in parallel with the trigger indicator itself."
